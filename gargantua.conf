# -*- mode: yaml -*-
# ReBench config for benchmarking on gargantua, using prebuilt binaries only.
#
#   rebench -D -d gargantua.conf ruby-test                         # 1 iteration each, correctness
#   rebench -D -d -df gargantua.data gargantua.conf ruby-steady    # full measurement (long)
default_experiment: ruby-test
default_data_file: 'gargantua-test.data'

.iteration_numbers:
    native: &NATIVE_ITERATIONS 300
    wasm:   &WASM_ITERATIONS   100

.benchmark_lists:
    test: &TEST_BENCHMARKS
        - DeltaBlue:
            extra_args: 1
        - Richards:
            extra_args: 1
        - Json:
            extra_args: 1
        - CD:
            extra_args: 10
        - Havlak:
            extra_args: 1

        - Bounce:
            input_sizes: [1, 100]
        - List:
            extra_args: 1
        - Mandelbrot:
            input_sizes: [1, 500, 750]
        - NBody:
            extra_args: 1
        - Permute:
            input_sizes: [1]
        - Queens:
            input_sizes: [1]
        - Sieve:
            input_sizes: [1]
        - Storage:
            input_sizes: [1]
        - Towers:
            input_sizes: [1]

    steady: &STEADY_BENCHMARKS
        - DeltaBlue:
            extra_args: 12000
        - Richards:
            extra_args: 100
        - Json:
            extra_args: 100
        - CD:
            extra_args: 250
        - Havlak:
            extra_args: 1500

        - Bounce:
            extra_args: 1500
        - List:
            extra_args: 1500
        - Mandelbrot:
            extra_args: 500
        - NBody:
            extra_args: 250000
        - Permute:
            extra_args: 1000
        - Queens:
            extra_args: 1000
        - Sieve:
            extra_args: 3000
        - Storage:
            extra_args: 1000
        - Towers:
            extra_args: 600

benchmark_suites:
    ruby-test:
        gauge_adapter: RebenchLog
        location: benchmarks/Ruby
        command: "harness.rb %(benchmark)s 1 %(input)s "
        invocations: 1
        iterations: 1
        min_iteration_time: 0
        max_invocation_time: 240
        benchmarks: *TEST_BENCHMARKS

    ruby-steady:
        gauge_adapter: RebenchLog
        location: benchmarks/Ruby
        command: "harness.rb %(benchmark)s %(variable)s "
        variable_values: [*NATIVE_ITERATIONS]
        max_invocation_time: 6000
        execute_exclusively: false
        benchmarks: *STEADY_BENCHMARKS

    cpython-test:
        gauge_adapter: RebenchLog
        location: benchmarks/Python
        command: "harness.py %(benchmark)s 1 %(input)s "
        invocations: 1
        iterations: 1
        min_iteration_time: 0
        max_invocation_time: 240
        benchmarks: *TEST_BENCHMARKS

    cpython-steady:
        gauge_adapter: RebenchLog
        location: benchmarks/Python
        command: "harness.py %(benchmark)s %(variable)s "
        variable_values: [*NATIVE_ITERATIONS]
        max_invocation_time: 6000
        execute_exclusively: false
        benchmarks: *STEADY_BENCHMARKS

    quickjs-test:
        gauge_adapter: RebenchLog
        location: benchmarks/JavaScript
        command: "harness-quickjs.js %(benchmark)s 1 %(input)s "
        invocations: 1
        iterations: 1
        min_iteration_time: 0
        max_invocation_time: 240
        benchmarks: *TEST_BENCHMARKS

    quickjs-steady:
        gauge_adapter: RebenchLog
        location: benchmarks/JavaScript
        command: "harness-quickjs.js %(benchmark)s %(variable)s "
        variable_values: [*NATIVE_ITERATIONS]
        max_invocation_time: 6000
        execute_exclusively: false
        benchmarks: *STEADY_BENCHMARKS

    node-test:
        gauge_adapter: RebenchLog
        location: benchmarks/JavaScript
        command: "harness.js %(benchmark)s 1 %(input)s "
        invocations: 1
        iterations: 1
        min_iteration_time: 0
        max_invocation_time: 240
        benchmarks: *TEST_BENCHMARKS

    node-steady:
        gauge_adapter: RebenchLog
        location: benchmarks/JavaScript
        command: "harness.js %(benchmark)s %(variable)s "
        variable_values: [*NATIVE_ITERATIONS]
        max_invocation_time: 6000
        execute_exclusively: false
        benchmarks: *STEADY_BENCHMARKS

    ruby-wasm-test:
        gauge_adapter: RebenchLog
        location: benchmarks/Ruby
        command: "/home/mschnei2/Languages/Benchmarks/are-we-fast-yet/benchmarks/Ruby/harness.rb %(benchmark)s 1 %(input)s "
        invocations: 1
        iterations: 1
        min_iteration_time: 0
        max_invocation_time: 600
        benchmarks: *TEST_BENCHMARKS

    ruby-wasm-steady:
        gauge_adapter: RebenchLog
        location: benchmarks/Ruby
        command: "/home/mschnei2/Languages/Benchmarks/are-we-fast-yet/benchmarks/Ruby/harness.rb %(benchmark)s %(variable)s "
        variable_values: [*WASM_ITERATIONS]
        max_invocation_time: 6000
        execute_exclusively: false
        benchmarks: *STEADY_BENCHMARKS

    cpython-wasm-test:
        gauge_adapter: RebenchLog
        location: benchmarks/Python
        command: "/home/mschnei2/Languages/Benchmarks/are-we-fast-yet/benchmarks/Python/harness.py %(benchmark)s 1 %(input)s "
        invocations: 1
        iterations: 1
        min_iteration_time: 0
        max_invocation_time: 600
        benchmarks: *TEST_BENCHMARKS

    cpython-wasm-steady:
        gauge_adapter: RebenchLog
        location: benchmarks/Python
        command: "/home/mschnei2/Languages/Benchmarks/are-we-fast-yet/benchmarks/Python/harness.py %(benchmark)s %(variable)s "
        variable_values: [*WASM_ITERATIONS]
        max_invocation_time: 6000
        execute_exclusively: false
        benchmarks: *STEADY_BENCHMARKS

    quickjs-wasm-test:
        gauge_adapter: RebenchLog
        location: benchmarks/JavaScript
        command: "/home/mschnei2/Languages/Benchmarks/are-we-fast-yet/benchmarks/JavaScript/harness-quickjs.js %(benchmark)s 1 %(input)s "
        invocations: 1
        iterations: 1
        min_iteration_time: 0
        max_invocation_time: 600
        benchmarks: *TEST_BENCHMARKS

    quickjs-wasm-steady:
        gauge_adapter: RebenchLog
        location: benchmarks/JavaScript
        command: "/home/mschnei2/Languages/Benchmarks/are-we-fast-yet/benchmarks/JavaScript/harness-quickjs.js %(benchmark)s %(variable)s "
        variable_values: [*WASM_ITERATIONS]
        max_invocation_time: 6000
        execute_exclusively: false
        benchmarks: *STEADY_BENCHMARKS

executors:
    Ruby-Interp:
        path: /home/mschnei2/Languages/Builds/ruby-default
        executable: ruby
        args: "--disable-gems -I /home/mschnei2/Languages/Ruby/ruby/lib --disable=yjit --disable=zjit"
    Ruby-YJIT:
        path: /home/mschnei2/Languages/Builds/ruby-default
        executable: ruby
        args: "--disable-gems -I /home/mschnei2/Languages/Ruby/ruby/lib --yjit"
    Ruby-ZJIT:
        path: /home/mschnei2/Languages/Builds/ruby-default
        executable: ruby
        args: "--disable-gems -I /home/mschnei2/Languages/Ruby/ruby/lib --zjit"
    CPython-Default:
        path: /home/mschnei2/Languages/Builds/cpython-default
        executable: python
    CPython-Opt:
        path: /home/mschnei2/Languages/Builds/cpython-opt
        executable: python
    CPython-JIT:
        path: /home/mschnei2/Languages/Builds/cpython-jit
        executable: python
    QuickJS:
        path: /home/mschnei2/Languages/Builds/quickjs-default
        executable: qjs
    Node-Ignition:
        path: /home/mschnei2/Languages/Builds/node-default/Release
        executable: node
        args: "--no-sparkplug --no-maglev --no-turbofan"
    Node-Sparkplug:
        path: /home/mschnei2/Languages/Builds/node-default/Release
        executable: node
        args: "--no-maglev --no-turbofan"
    Node-Maglev:
        path: /home/mschnei2/Languages/Builds/node-default/Release
        executable: node
        args: "--no-turbofan"
    Node:
        path: /home/mschnei2/Languages/Builds/node-default/Release
        executable: node
    Ruby-Wasm-Wasmtime:
        path: /home/mschnei2/.local/bin
        executable: wasmtime
        args: "run -W max-wasm-stack=4194304 --dir /::/ /home/mschnei2/Languages/Builds/ruby-wasm/ruby.wasm --disable-gems -I /home/mschnei2/Languages/Builds/ruby-wasm/ruby-wasm32-wasi/usr/local/lib/ruby/4.1.0+6 -I /home/mschnei2/Languages/Builds/ruby-wasm/ruby-wasm32-wasi/usr/local/lib/ruby/4.1.0+6/wasm32-wasi"
    Ruby-Wasm-Wizard:
        path: /home/mschnei2/wizard-engine/bin
        executable: wizeng
        args: "--mode=dyn --ext:all --stack-size=8M --dir=/ /home/mschnei2/Languages/Builds/ruby-wasm/ruby.wasm --disable-gems -I /home/mschnei2/Languages/Builds/ruby-wasm/ruby-wasm32-wasi/usr/local/lib/ruby/4.1.0+6 -I /home/mschnei2/Languages/Builds/ruby-wasm/ruby-wasm32-wasi/usr/local/lib/ruby/4.1.0+6/wasm32-wasi"
    Ruby-Wasm-Winch:
        path: /home/mschnei2/.local/bin
        executable: wasmtime
        args: "run -C compiler=winch -W max-wasm-stack=4194304 --dir /::/ /home/mschnei2/Languages/Builds/ruby-wasm/ruby.wasm --disable-gems -I /home/mschnei2/Languages/Builds/ruby-wasm/ruby-wasm32-wasi/usr/local/lib/ruby/4.1.0+6 -I /home/mschnei2/Languages/Builds/ruby-wasm/ruby-wasm32-wasi/usr/local/lib/ruby/4.1.0+6/wasm32-wasi"
    Ruby-Wasm-Pulley:
        path: /home/mschnei2/.local/bin
        executable: wasmtime
        args: "run --target pulley64 -W max-wasm-stack=4194304 --dir /::/ /home/mschnei2/Languages/Builds/ruby-wasm/ruby.wasm --disable-gems -I /home/mschnei2/Languages/Builds/ruby-wasm/ruby-wasm32-wasi/usr/local/lib/ruby/4.1.0+6 -I /home/mschnei2/Languages/Builds/ruby-wasm/ruby-wasm32-wasi/usr/local/lib/ruby/4.1.0+6/wasm32-wasi"
    Ruby-Wasm-Wizard-Int:
        path: /home/mschnei2/wizard-engine/bin
        executable: wizeng
        args: "--mode=int --ext:all --stack-size=8M --dir=/ /home/mschnei2/Languages/Builds/ruby-wasm/ruby.wasm --disable-gems -I /home/mschnei2/Languages/Builds/ruby-wasm/ruby-wasm32-wasi/usr/local/lib/ruby/4.1.0+6 -I /home/mschnei2/Languages/Builds/ruby-wasm/ruby-wasm32-wasi/usr/local/lib/ruby/4.1.0+6/wasm32-wasi"
    CPython-Wasm-Wasmtime:
        path: /home/mschnei2/.local/bin
        executable: wasmtime
        args: "run --dir /::/ --config /home/mschnei2/Languages/Builds/cpython-wasm/etc/python3.16/wasmtime.toml --argv0 /home/mschnei2/Languages/Builds/cpython-wasm/lib/python3.16/lib-wasm/python3.16.wasm /home/mschnei2/Languages/Builds/cpython-wasm/lib/python3.16/lib-wasm/python3.16.wasm"
    CPython-Wasm-Wizard:
        path: /home/mschnei2/wizard-engine/bin
        executable: wizeng
        args: "--mode=dyn --ext:all --stack-size=8M --dir=/ /home/mschnei2/Languages/Builds/cpython-wasm/lib/python3.16/lib-wasm/python3.16.wasm"
    CPython-Wasm-Winch:
        path: /home/mschnei2/.local/bin
        executable: wasmtime
        args: "run -C compiler=winch --dir /::/ --config /home/mschnei2/Languages/Builds/cpython-wasm/etc/python3.16/wasmtime.toml --argv0 /home/mschnei2/Languages/Builds/cpython-wasm/lib/python3.16/lib-wasm/python3.16.wasm /home/mschnei2/Languages/Builds/cpython-wasm/lib/python3.16/lib-wasm/python3.16.wasm"
    CPython-Wasm-Pulley:
        path: /home/mschnei2/.local/bin
        executable: wasmtime
        args: "run --target pulley64 --dir /::/ --config /home/mschnei2/Languages/Builds/cpython-wasm/etc/python3.16/wasmtime.toml --argv0 /home/mschnei2/Languages/Builds/cpython-wasm/lib/python3.16/lib-wasm/python3.16.wasm /home/mschnei2/Languages/Builds/cpython-wasm/lib/python3.16/lib-wasm/python3.16.wasm"
    CPython-Wasm-Wizard-Int:
        path: /home/mschnei2/wizard-engine/bin
        executable: wizeng
        args: "--mode=int --ext:all --stack-size=8M --dir=/ /home/mschnei2/Languages/Builds/cpython-wasm/lib/python3.16/lib-wasm/python3.16.wasm"
    QuickJS-Wasm-Wasmtime:
        path: /home/mschnei2/.local/bin
        executable: wasmtime
        args: "run --dir /::/ /home/mschnei2/Languages/Builds/quickjs-wasm/qjs.wasm"
    QuickJS-Wasm-Wizard:
        path: /home/mschnei2/wizard-engine/bin
        executable: wizeng
        args: "--mode=dyn --ext:all --stack-size=8M --dir=/ /home/mschnei2/Languages/Builds/quickjs-wasm/qjs.wasm"
    QuickJS-Wasm-Winch:
        path: /home/mschnei2/.local/bin
        executable: wasmtime
        args: "run -C compiler=winch --dir /::/ /home/mschnei2/Languages/Builds/quickjs-wasm/qjs.wasm"
    QuickJS-Wasm-Pulley:
        path: /home/mschnei2/.local/bin
        executable: wasmtime
        args: "run --target pulley64 --dir /::/ /home/mschnei2/Languages/Builds/quickjs-wasm/qjs.wasm"
    QuickJS-Wasm-Wizard-Int:
        path: /home/mschnei2/wizard-engine/bin
        executable: wizeng
        args: "--mode=int --ext:all --stack-size=8M --dir=/ /home/mschnei2/Languages/Builds/quickjs-wasm/qjs.wasm"

experiments:
    ruby-test:
        suites: [ruby-test]
        executions: [Ruby-Interp, Ruby-YJIT, Ruby-ZJIT]
    ruby-steady:
        suites: [ruby-steady]
        executions: [Ruby-Interp, Ruby-YJIT, Ruby-ZJIT]
    cpython-test:
        suites: [cpython-test]
        executions: [CPython-Default, CPython-Opt, CPython-JIT]
    cpython-steady:
        suites: [cpython-steady]
        executions: [CPython-Default, CPython-Opt, CPython-JIT]
    quickjs-test:
        suites: [quickjs-test]
        executions: [QuickJS]
    quickjs-steady:
        suites: [quickjs-steady]
        executions: [QuickJS]
    node-test:
        suites: [node-test]
        executions: [Node-Ignition, Node-Sparkplug, Node-Maglev, Node]
    node-steady:
        suites: [node-steady]
        executions: [Node-Ignition, Node-Sparkplug, Node-Maglev, Node]
    ruby-wasm-test:
        suites: [ruby-wasm-test]
        executions: [Ruby-Wasm-Wasmtime, Ruby-Wasm-Winch, Ruby-Wasm-Pulley, Ruby-Wasm-Wizard, Ruby-Wasm-Wizard-Int]
    ruby-wasm-steady:
        suites: [ruby-wasm-steady]
        executions: [Ruby-Wasm-Wasmtime, Ruby-Wasm-Winch, Ruby-Wasm-Pulley, Ruby-Wasm-Wizard, Ruby-Wasm-Wizard-Int]
    cpython-wasm-test:
        suites: [cpython-wasm-test]
        executions: [CPython-Wasm-Wasmtime, CPython-Wasm-Winch, CPython-Wasm-Pulley, CPython-Wasm-Wizard, CPython-Wasm-Wizard-Int]
    cpython-wasm-steady:
        suites: [cpython-wasm-steady]
        executions: [CPython-Wasm-Wasmtime, CPython-Wasm-Winch, CPython-Wasm-Pulley, CPython-Wasm-Wizard, CPython-Wasm-Wizard-Int]
    quickjs-wasm-test:
        suites: [quickjs-wasm-test]
        executions: [QuickJS-Wasm-Wasmtime, QuickJS-Wasm-Winch, QuickJS-Wasm-Pulley, QuickJS-Wasm-Wizard, QuickJS-Wasm-Wizard-Int]
    quickjs-wasm-steady:
        suites: [quickjs-wasm-steady]
        executions: [QuickJS-Wasm-Wasmtime, QuickJS-Wasm-Winch, QuickJS-Wasm-Pulley, QuickJS-Wasm-Wizard, QuickJS-Wasm-Wizard-Int]
